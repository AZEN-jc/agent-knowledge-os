[project]
name = "agent-knowledge-os"
version = "0.1.0"
# 归属说明：这个仓库里有两套系统共处 —— MingLi Agent（命理推理，当前唯一在推进的）
# 与 Personal Media OS（内容流水线，冻结）。本 description 描述 MingLi。
# 模块边界见 AGENTS.md §1。
description = "MingLi Agent：可验证的命理推理服务。确定性排盘 → 事实提取 → 规则匹配 → 证据链，每个结论都能追到命盘要素与典籍出处。"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "admin" }
]
# 这份清单与 requirements.txt 逐项一致（含版本约束），一致性由
# tests/test_dependency_declaration.py 钉住。改一处必须改另一处。
#
# 2026-10-18 删除 everos / python-dotenv / rich：AST 扫全仓（含 tests/）确认
# 零 import、零引用，老板确认删除。删除前它们登记在
# tests/test_dependency_declaration.py 的 DECLARED_BUT_UNUSED 里。
dependencies = [
  "arbiter-lite",
  "requests",
  "pydantic",
  "pytest",
  "sxtwl==2.0.7",
  # 第二实现：独立命理库，仅用于 differential testing 交叉校验，不参与生产排盘
  "lunar_python==1.4.8",
  "fastapi",
  "uvicorn"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 项目约定：DTZ（naive 本地时间戳，全库字符串时间比较依赖它）与
# BLE（后端异常必须兜底转成可解释失败，不许崩）是既有风格，不列为 lint 项；
# RUF001-003（模糊 Unicode）会误伤中文注释/文档字符串，排除。
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# scripts 先做 sys.path 引导再 import，属有意为之
"scripts/*" = ["E402"]
# evaluation/runner.py 同一模式：它要先把仓库根插进 sys.path 才能按路径直接跑
"evaluation/runner.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
# 类型检查只覆盖生产代码；测试的断言风格由 pytest 保证（tests 里多为
# store.get() 返回 Optional 的收窄与 **dict 构造，属测试写法而非产品缺陷）
exclude = ["^tests/"]
