[project]
name = "agent-knowledge-os"
version = "0.1.0"
description = "本地 AI Agent 知识库系统，把 EverOS、Arbiter、Obsidian 和 Codex 工作流连接起来。"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "admin" }
]
dependencies = [
  "everos",
  "arbiter-lite",
  "requests",
  "python-dotenv",
  "pydantic",
  "rich",
  "pytest",
  "sxtwl==2.0.7",
  # 第二实现：独立命理库，仅用于 differential testing 交叉校验，不参与生产排盘
  "lunar_python==1.4.8",
  "fastapi",
  "uvicorn"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 项目约定：DTZ（naive 本地时间戳，全库字符串时间比较依赖它）与
# BLE（后端异常必须兜底转成可解释失败，不许崩）是既有风格，不列为 lint 项；
# RUF001-003（模糊 Unicode）会误伤中文注释/文档字符串，排除。
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# scripts 先做 sys.path 引导再 import，属有意为之
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
# 类型检查只覆盖生产代码；测试的断言风格由 pytest 保证（tests 里多为
# store.get() 返回 Optional 的收窄与 **dict 构造，属测试写法而非产品缺陷）
exclude = ["^tests/"]
