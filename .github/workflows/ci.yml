name: CI

# 只在 master 与本仓库的硬化分支上跑。不自动推任何东西。
on:
  push:
    branches: [master, "hardening/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 测试 · 评估 · 静态检查
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 用 requirements-dev.txt：它 `-r requirements.txt` 引用了运行时依赖，
          # 并额外钉住 ruff 与 mypy。这两个工具此前没有在任何地方声明为依赖，
          # 是审计报告 §5 的 R4。
          pip install -r requirements-dev.txt

      # ── 阻塞项：失败即 CI 失败 ──────────────────────────────────────

      - name: ruff check .
        run: ruff check .

      - name: pytest
        run: python -m pytest tests/ -q

      - name: 评估门禁（行为不变量）
        run: python evaluation/runner.py --json

      # Phase 4.7 起，provider 契约也是门禁。它跑 11 个对抗场景：
      # 越界引用、编造出处、必然性措辞、非 JSON、provider 故障、预算耗尽……
      # 任何一个场景失守，说明某条红线只剩文档、没有代码。
      - name: 契约门禁（provider 对抗场景）
        run: python evaluation/provider_conformance.py --json

      # Phase 5.2 起 E2E 也是门禁。契约测试（test_frontend_contract.py）
      # 盯字段路径且不需要浏览器，在常规 pytest 里跑；这个文件要真实
      # Chromium —— 单独一步装浏览器，失败时能分清是包的问题还是浏览器
      # 的问题。没有浏览器时 E2E 整套 skip（环境事实），装了却不跑才是缺陷。
      - name: 安装 Playwright 浏览器
        run: python -m playwright install --with-deps chromium

      - name: E2E（真实浏览器跑前端主链路 + 骨架快照）
        run: python -m pytest tests/test_e2e_frontend.py tests/test_frontend_snapshot.py -q

      # mypy 已于 Phase 2 清零（原存量 4 错：engines/bazi/golden.py 的 Any 并集、
      # sxtwl_provider.py 的 C 扩展对象 tg/dz、utcoffset() 可空）。修法见
      # 审计报告 §6.2 与提交 9ea8460 之后的类型收窄提交。
      # 从 continue-on-error 翻成阻塞：基线干净之后，门禁就该真的拦人。
      - name: mypy .
        run: mypy .

      - name: 汇总
        if: always()
        run: |
          echo "### CI 结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- ruff / pytest / 评估门禁 / 契约门禁 / E2E / mypy 均为阻塞项" >> "$GITHUB_STEP_SUMMARY"
