name: CI

# 只在 master 与本仓库的硬化分支上跑。不自动推任何东西。
on:
  push:
    branches: [master, "hardening/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 测试 · 评估 · 静态检查
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 用 requirements-dev.txt：它 `-r requirements.txt` 引用了运行时依赖，
          # 并额外钉住 ruff 与 mypy。这两个工具此前没有在任何地方声明为依赖，
          # 是审计报告 §5 的 R4。
          pip install -r requirements-dev.txt

      # ── 阻塞项：失败即 CI 失败 ──────────────────────────────────────

      - name: ruff check .
        run: ruff check .

      - name: pytest
        run: python -m pytest tests/ -q

      - name: 评估门禁（行为不变量）
        run: python evaluation/runner.py --json

      # ── 非阻塞项：已知存量错误，修完后改为阻塞 ──────────────────────
      #
      # `mypy .` 当前报 4 个错误，全部是存量、全部在 engines/bazi/ 下，
      # 本阶段不允许改动排盘代码，因此不在此处修：
      #
      #   engines/bazi/golden.py:44        Incompatible types in assignment
      #   engines/bazi/sxtwl_provider.py:65  "object" has no attribute "tg"
      #   engines/bazi/sxtwl_provider.py:66  "object" has no attribute "dz"
      #   engines/bazi/sxtwl_provider.py:122 Item "None" ... total_seconds
      #
      # 前三条源于 sxtwl 的 C 扩展无类型存根；第四条是可选值未收窄。
      # 处置方案见审计报告 §7。**不要用 `# type: ignore` 抹掉它们** ——
      # 那会把「类型系统在这里帮不上忙」和「这里真的有问题」混为一谈。
      - name: mypy .（非阻塞，存量 4 错）
        continue-on-error: true
        run: mypy .

      - name: 汇总
        if: always()
        run: |
          echo "### CI 结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- ruff / pytest / 评估门禁为阻塞项" >> "$GITHUB_STEP_SUMMARY"
          echo "- mypy 为非阻塞项（存量 4 错，见 workflow 注释与审计报告 §7）" >> "$GITHUB_STEP_SUMMARY"
