<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MingLi Agent · 可验证的命理推理</title>
<style>
  :root {
    --ink: #1a1a1a; --muted: #6b6b6b; --line: #d8d4cc; --bg: #faf8f4;
    --card: #ffffff; --accent: #8c2f39; --ok: #2f6b4f; --warn: #a8641a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--ink);
    font: 15px/1.6 "Songti SC", "Noto Serif CJK SC", serif;
  }
  main { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: .04em; }
  h2 { font-size: 16px; margin: 28px 0 10px; padding-bottom: 6px;
       border-bottom: 1px solid var(--line); }
  .thesis { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  form, .card { background: var(--card); border: 1px solid var(--line);
                border-radius: 4px; padding: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--muted); }
  input, select, button {
    font: inherit; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 3px; background: #fff; color: var(--ink);
  }
  input { width: 84px; }
  button { cursor: pointer; background: var(--ink); color: #fff; border-color: var(--ink); }
  button.ghost { background: #fff; color: var(--ink); }
  button:hover { opacity: .85; }
  .topics { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; }
  .topics label { display: flex; gap: 5px; align-items: center; font-size: 14px; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 14px; }
  th, td { border: 1px solid var(--line); padding: 6px 9px; text-align: left;
           vertical-align: top; }
  th { background: #f2efe9; font-weight: 600; font-size: 13px; }
  .pillar-glyph { font-size: 20px; letter-spacing: .1em; }
  .rule { border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px;
          margin-top: 10px; background: var(--card); }
  .rule-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .rule-id { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
  .tag { font-size: 11px; padding: 1px 6px; border: 1px solid var(--line);
         border-radius: 10px; color: var(--muted); }
  .tag.classical { color: var(--accent); border-color: var(--accent); }
  .conclusion { margin: 8px 0; }
  .cond { font-size: 13px; color: var(--muted); margin-left: 14px; }
  .cond code { font-family: ui-monospace, monospace; color: var(--ink); }
  .citation { margin-top: 8px; padding: 8px 10px; background: #f7f3ec;
              border-left: 3px solid var(--accent); font-size: 13px; }
  .citation a { color: var(--accent); }
  .verdict { font-weight: 600; }
  .verdict.ok { color: var(--ok); }
  .verdict.bad { color: var(--warn); }
  .report-line { font-size: 15px; margin-top: 6px; }
  .signal { font-size: 13px; color: var(--muted); margin-left: 16px; }
  .empty { color: var(--muted); font-style: italic; }
  .error { color: var(--accent); background: #fdf3f4; border: 1px solid var(--accent);
           padding: 10px 12px; border-radius: 4px; margin-top: 12px; white-space: pre-wrap; }
  /* 字段级错误（Phase 5.2）：贴在出错的输入框下面，不是只会在顶部出现一次的
     一段文字。五个输入框的时代，用户需要知道错的是哪一个。 */
  .field-error { color: var(--accent); font-size: 12px; max-width: 220px; }
  .field.invalid input, .field.invalid select { border-color: var(--accent); }
  /* hidden 属性必须赢过布局规则。.row 是 flex 容器，UA 给 [hidden] 的
     display:none 在特异性上输给 .row{display:flex} —— 不写这条，
     真太阳时的经纬度行会在没勾选时漏出来。 */
  [hidden] { display: none !important; }
  .geo-hint { font-size: 12px; color: var(--muted); }
  /* 多主题工作台（Phase 5.5）：主题页签 + 当前主题的证据链。 */
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .tabs button {
    font: inherit; padding: 5px 14px; border: 1px solid var(--line);
    border-radius: 999px; background: #fff; color: var(--ink); cursor: pointer;
  }
  .tabs button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tabs button.failed { color: var(--accent); border-color: var(--accent); }
  /* 时间轴的大运分组头（Phase 5.6）：十年一运，跨运的年份不该看起来连续。 */
  .dayun-head {
    margin: 14px 0 4px; padding: 4px 10px; font-size: 13px; color: var(--muted);
    border-left: 3px solid var(--line); background: #f7f3ec;
  }
  /* 导出工具条（Phase 5.7）：跟在分析结果后面，导出的是刚看的这份。 */
  .export-bar { display: flex; gap: 8px; margin-bottom: 12px; }
  footer { margin: 36px 0 8px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>MingLi Agent</h1>
  <p class="thesis">
    确定性排盘 → 事实提取 → 规则匹配 → 证据链。每个结论都能追到命盘要素与规则出处；
    信号是结构描述，不是预测。证据强度是证据等级，不是事件概率。
  </p>

  <form id="form">
    <div class="row">
      <div class="field"><label for="year">公历年</label><input id="year" type="number" value="1990"></div>
      <div class="field"><label for="month">月</label><input id="month" type="number" value="2" min="1" max="12"></div>
      <div class="field"><label for="day">日</label><input id="day" type="number" value="1" min="1" max="31"></div>
      <div class="field"><label for="hour">时（0-23）</label><input id="hour" type="number" value="12" min="0" max="23"></div>
      <div class="field"><label for="minute">分（0-59）</label><input id="minute" type="number" value="0" min="0" max="59"></div>
      <div class="field"><label for="gender">性别</label>
        <select id="gender"><option value="">不填（只算流年）</option><option>男</option><option>女</option></select>
      </div>
      <div class="field"><label for="tst">真太阳时</label>
        <input id="tst" type="checkbox" style="width:auto">
      </div>
      <div class="field"><label>&nbsp;</label>
        <button type="submit" id="run">多主题分析</button>
      </div>
      <div class="field"><label>&nbsp;</label>
        <button type="button" class="ghost" id="chart-only">只看命盘</button>
      </div>
    </div>

    <!-- 真太阳时才需要的出生地经纬度。默认隐藏：民用时口径不问地理，
         勾选真太阳时才出现 —— 不该让多数用户面对两个永远空着的输入框。
         经度是必填（引擎缺了它只能拒绝），纬度只影响均时差细节可留空。 -->
    <div class="row" id="geo-row" hidden>
      <div class="field"><label for="longitude">经度（必填）</label><input id="longitude" type="number" step="0.1" min="-180" max="180"></div>
      <div class="field"><label for="latitude">纬度（可空）</label><input id="latitude" type="number" step="0.1" min="-90" max="90"></div>
      <div class="field"><span class="geo-hint">按出生地经度校正，西端地区可跨两个时辰</span></div>
    </div>

    <div class="topics" id="topics"></div>

    <div class="row" style="margin-top:14px">
      <div class="field"><label for="from">时间轴起</label><input id="from" type="number" value="2024"></div>
      <div class="field"><label for="to">时间轴止</label><input id="to" type="number" value="2030"></div>
      <div class="field"><label for="timeline-topic">主题</label>
        <select id="timeline-topic"></select>
      </div>
      <div class="field"><label>&nbsp;</label>
        <button type="button" class="ghost" id="timeline">流年时间轴</button>
      </div>
      <div class="field"><label>&nbsp;</label>
        <button type="button" class="ghost" id="shift-back">◀ 前一段</button>
      </div>
      <div class="field"><label>&nbsp;</label>
        <button type="button" class="ghost" id="shift-forward">后一段 ▶</button>
      </div>
      <div class="field"><label>&nbsp;</label>
        <button type="button" class="ghost" id="library-btn">典籍库</button>
      </div>
    </div>
  </form>

  <div id="error"></div>

  <section id="out-chart" hidden>
    <h2>命盘</h2>
    <div class="card" id="chart"></div>
  </section>

  <section id="out-analysis" hidden>
    <h2>证据链</h2>
    <div class="export-bar">
      <button type="button" class="ghost" id="export-json">导出 JSON</button>
      <button type="button" class="ghost" id="export-pdf">导出 PDF</button>
    </div>
    <div id="analysis">
      <div id="topic-tabs"></div>
      <div id="topic-detail"></div>
    </div>
  </section>

  <section id="out-timeline" hidden>
    <h2>流年时间轴</h2>
    <div class="card" id="timeline-out"></div>
  </section>

  <section id="out-library" hidden>
    <h2>典籍与规则库</h2>
    <div class="card" id="library"></div>
  </section>

  <footer>
    确定性部分由 <code>engines.bazi</code> 计算（寿星天文历对拍）；结构层规则来自可执行定义表；
    典籍层规则逐字回对固化底本，出处带书名、底本、逐字原文与可打开地址。
  </footer>
</main>

<script>
"use strict";

const TOPIC_OPTIONS = ["事业", "财运", "婚姻", "健康", "命局"];
const $ = (id) => document.getElementById(id);

/** 引擎返回的柱名是英文（year/month/day/hour）——界面其余全中文，
 *  四个英文词杵在命盘表里破坏一致性。映射表放这里，渲染时不猜。 */
const PILLAR_LABELS = { year: "年柱", month: "月柱", day: "日柱", hour: "时柱" };

/** 建元素。**全程用 textContent，不用 innerHTML** —— 数据来自 API 与用户输入，
 *  拼 HTML 字符串等于自己开一个注入口。 */
function el(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined && text !== null) node.textContent = String(text);
  if (cls) node.className = cls;
  return node;
}

function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

function showError(message) {
  const box = $("error");
  clear(box);
  box.appendChild(el("div", message, "error"));
}

/** 把字段级错误贴到对应输入框下面（Phase 5.2）。
 *
 *  ``fields`` 是 API 422 响应里的数组：``[{"field": "month", "message": "…"}]``。
 *  ``field`` 是**原始字段名**，与输入框的 id 一一对应 —— 契约测试
 *  （tests/test_frontend_contract.py）钉住这个对应关系。
 *
 *  找不到对应输入框的条目（模型级错误，field 为「请求」）不丢：退回顶部
 *  错误区，由 showError 显示。 */
function showFieldErrors(fields) {
  clearFieldErrors();
  if (!Array.isArray(fields)) return;
  for (const item of fields) {
    const input = item && item.field ? $(item.field) : null;
    if (!input) continue;
    const host = input.closest(".field") || input.parentElement;
    host.classList.add("invalid");
    host.appendChild(el("div", item.message, "field-error"));
  }
}

function clearFieldErrors() {
  for (const node of document.querySelectorAll(".field.invalid")) {
    node.classList.remove("invalid");
    for (const child of Array.from(node.querySelectorAll(".field-error"))) {
      node.removeChild(child);
    }
  }
}

/** 顶部错误区 + 字段级错误一起显示，再返回 false 方便调用方中断。 */
function reportError(error) {
  showError(String((error && error.message) || error));
  showFieldErrors(error && error.fields);
  return false;
}

/** 发请求并做好错误整形，返回原始 Response。
 *
 *  返回 Response 而不是解析后的 JSON：导出（Phase 5.7）要的是 blob，
 *  解析了就把字节弄丢了。post/get 在这一层之上解析。 */
async function request(method, path, body) {
  const res = await fetch(path, {
    method: method,
    headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (!res.ok) {
    // 把字段级条目带在错误对象上：只抛 message 会把 fields 数组丢掉，
    // 前端就退回「顶部一句中文串」的旧体验。
    const data = await res.json().catch(() => ({}));
    const error = new Error(data.detail || `HTTP ${res.status}`);
    error.fields = data.fields;
    throw error;
  }
  return res;
}

async function post(path, body) {
  const res = await request("POST", path, body);
  return res.json();
}

async function get(path) {
  const res = await request("GET", path);
  return res.json();
}

function birth() {
  const body = {
    year: Number($("year").value),
    month: Number($("month").value),
    day: Number($("day").value),
    hour: Number($("hour").value),
    minute: Number($("minute").value),
  };
  const gender = $("gender").value;
  if (gender) body.gender = gender;
  // 真太阳时是显式开关：勾了才送口径与经纬度。不勾选时送经纬度没有意义
  // （民用时口径不用它），还会让请求体暗示一种没被请求的校正。
  if ($("tst").checked) {
    body.true_solar_time = true;
    const longitude = $("longitude").value.trim();
    if (longitude) body.longitude = Number(longitude);
    const latitude = $("latitude").value.trim();
    if (latitude) body.latitude = Number(latitude);
  }
  return body;
}

/** 提交前的客户端守卫：真太阳时勾了但经度空着。
 *
 *  服务端同样会拒（请求模型层，中文直指经度），但那一来一回纯属浪费——
 *  必填检查在客户端做，引擎级校验留给服务端当权威。 */
function birthOrFieldError() {
  clearFieldErrors();
  const body = birth();
  if ($("tst").checked && body.longitude === undefined) {
    $("longitude").closest(".field").classList.add("invalid");
    $("longitude").closest(".field").appendChild(
      el("div", "开启真太阳时必须填写经度。", "field-error"));
    return null;
  }
  return body;
}

function selectedTopics() {
  return Array.from(document.querySelectorAll('input[name="topic"]:checked')).map((n) => n.value);
}

function buildTopicPicker() {
  const box = $("topics");
  for (const topic of TOPIC_OPTIONS) {
    const label = el("label");
    const input = el("input");
    input.type = "checkbox";
    input.name = "topic";
    input.value = topic;
    input.checked = topic === "事业" || topic === "财运";
    label.appendChild(input);
    label.appendChild(el("span", null, null));
    label.lastChild.textContent = topic;
    box.appendChild(label);
  }
  // 时间轴的主题单选（Phase 5.6）：时间轴一次只看一个主题，与多主题
  // 分析共享同一份主题表 —— 两处各写一份清单，迟早对不上。
  const timelineTopic = $("timeline-topic");
  for (const topic of TOPIC_OPTIONS) {
    const option = el("option", topic);
    option.value = topic;
    if (topic === "财运") option.selected = true;
    timelineTopic.appendChild(option);
  }
}

// ── 命盘 ───────────────────────────────────────────────────────────────

function renderChart(chart) {
  const box = $("chart");
  clear(box);

  box.appendChild(el("p", null, "report-line"));
  box.lastChild.textContent =
    `日主 ${chart.day_master}　·　${chart.provider}　·　算法 ${chart.algorithm_version}`;

  // 四列对齐：每个柱一列，天干/地支/藏干/十神/纳音各一行 —— 传统命盘的
  // 读法。Phase 5.3 之前是「一行一柱」的横表，读起来要左右扫。
  const table = el("table");
  const head = el("tr");
  head.appendChild(el("th", ""));
  for (const pillar of chart.pillars) {
    head.appendChild(el("th", PILLAR_LABELS[pillar.name] || pillar.name));
  }
  table.appendChild(head);

  const rows = [
    ["天干", (p) => p.heavenly_stem],
    ["地支", (p) => p.earthly_branch],
    ["藏干", (p) => (p.hidden_stems || []).join(" ")],
    ["十神", (p) => p.ten_god || ""],
    ["纳音", (p) => p.na_yin || ""],
  ];
  for (const row_def of rows) {
    const label = row_def[0];
    const pick = row_def[1];
    const row = el("tr");
    row.appendChild(el("td", label));
    for (const pillar of chart.pillars) {
      const glyph = label === "天干" || label === "地支";
      row.appendChild(el("td", pick(pillar), glyph ? "pillar-glyph" : null));
    }
    table.appendChild(row);
  }
  box.appendChild(table);

  // 五行普查（Phase 5.3）：计数、缺失、偏旺都来自 provider 随命盘产出的
  // chart.elements（与事实层同一个 element_census 实现）。缺与偏旺为空时
  // 不渲染那一行 —— 「缺：无」也是信息，但计数行本身已经说完了。
  const elements = chart.elements;
  if (elements && elements.count) {
    const counts = Object.entries(elements.count)
      .map((entry) => entry[0] + entry[1])
      .join("　");
    let line = `五行计数　${counts}`;
    if (elements.missing && elements.missing.length) {
      line += `　·　缺：${elements.missing.join("、")}`;
    }
    if (elements.dominant && elements.dominant.length) {
      line += `　·　偏旺：${elements.dominant.join("、")}`;
    }
    box.appendChild(el("p", line, "signal"));
  }

  // relations 的形状是 {type, branches, pillars}，不是 {type, pair} ——
  // 读错字段不会报错，只会让这一行永远空白。
  // 循环变量叫 relation 不叫 r：r 在 onAnalyze 里是 results 的元素，
  // 同一个名字指两个东西，静态契约测试的别名表会无所适从。
  const relations = (chart.relations || []).map(
    (relation) => `${relation.type}：${(relation.branches || []).join("")}（${(relation.pillars || []).join("+")}）`
  );
  box.appendChild(el("p", null, "signal"));
  box.lastChild.textContent =
    relations.length ? `地支关系 ${relations.join("；")}` : "四支之间无结构关系";

  // 「缺五行」一行曾在这里读 chart.elements.missing —— 那个键从来不存在
  // （provider 只放 day_master_element），所以这行从来没显示过。删掉而不是
  // 留着：五行普查（count/missing/dominant）属于 Phase 5.3 命盘可视化，
  // 到时候连着 provider 的 element_census 一起做，读真实存在的键。
  // 教训与 relations 那条注释同族：读错字段不会报错，只会让一行永远空白。
}

// ── 证据链 ─────────────────────────────────────────────────────────────

function renderCondition(condition) {
  const line = el("div", null, "cond");
  line.appendChild(el("code", condition.key));
  line.appendChild(document.createTextNode(
    `　要求 ${JSON.stringify(condition.expected)}　实际 ${JSON.stringify(condition.actual)}`
  ));
  const sources = condition.sources || [];
  if (sources.length) {
    line.appendChild(document.createTextNode(`　← ${sources.join("、")}`));
  }
  return line;
}

function renderCitation(citation, urn) {
  if (!citation && !urn) return null;
  const box = el("div", null, "citation");
  if (urn) box.appendChild(el("div", urn));
  if (citation) {
    box.appendChild(el("div", null, null));
    box.lastChild.textContent =
      `${citation.book}　·　${citation.edition}${citation.chapter ? "　·　" + citation.chapter : ""}`;
    if (citation.original_text) {
      box.appendChild(el("div", null, null));
      box.lastChild.textContent = `原文：「${citation.original_text}」`;
    }
    if (citation.url) {
      // 变量名 anchor 而不是 link：证据链的循环变量叫 link，两个不同的
      // 东西共用一个名字，静态契约测试（tests/test_frontend_contract.py）
      // 提取属性路径时会把 DOM 属性误登记成响应字段。
      const anchor = el("a", "打开出处");
      anchor.href = citation.url;
      anchor.target = "_blank";
      anchor.rel = "noopener noreferrer";
      box.appendChild(anchor);
    }
  }
  return box;
}

function renderChain(host, evidence) {
  clear(host);

  const status = el("p", null, "report-line");
  status.appendChild(el("span", `主题「${evidence.topic_name}」覆盖状态：${evidence.status}`, null));
  host.appendChild(status);
  host.appendChild(el("p", evidence.coverage_note, "signal"));

  if (evidence.untraced_rules && evidence.untraced_rules.length) {
    host.appendChild(el("p", `证据链断环：${evidence.untraced_rules.join("、")}`, "error"));
  }
  if (evidence.unreviewed_rules && evidence.unreviewed_rules.length) {
    host.appendChild(el("p", `含未校核规则：${evidence.unreviewed_rules.join("、")}`, "signal"));
  }

  const strength = el("p", null, "report-line");
  strength.textContent =
    `证据强度 ${evidence.strength.toFixed(2)}（支持 ${evidence.strength_breakdown.supporting_rules} 条`
    + `，原始支持量 ${evidence.strength_breakdown.raw_support}，饱和常数 ${evidence.strength_breakdown.saturation_k}）`;
  host.appendChild(strength);

  if (!evidence.chain.length) {
    host.appendChild(el("p", "这条命盘没有命中任何规则。", "empty"));
    return;
  }

  for (const link of evidence.chain) {
    // 卡片变量叫 card 不叫 rule：典籍库（Phase 5.4）的循环变量叫 rule，
    // 那是数据根。DOM 变量与数据根共用一个名字，静态契约测试的属性
    // 路径提取就会把 DOM 属性误登记成响应字段。
    const card = el("div", null, "rule");
    const head = el("div", null, "rule-head");
    head.appendChild(el("span", link.conclusion, "conclusion"));
    card.appendChild(head);

    const meta = el("div", null, "rule-head");
    meta.appendChild(el("span", link.rule_id, "rule-id"));
    meta.appendChild(el("span", link.confidence, "tag"));
    meta.appendChild(el("span", link.source_tier, link.source_tier === "classical" ? "tag classical" : "tag"));
    meta.appendChild(el("span", link.review_status, "tag"));
    if (!link.is_production_ready) meta.appendChild(el("span", "未达生产就绪", "tag"));
    card.appendChild(meta);

    for (const condition of link.conditions || []) {
      card.appendChild(renderCondition(condition));
    }

    const citation = renderCitation(link.citation, link.urn);
    if (citation) card.appendChild(citation);

    host.appendChild(card);
  }
}

function renderCritique(host, critique) {
  const verdict = el("p", null, "verdict " + (critique.passed ? "ok" : "bad"));
  verdict.textContent = critique.passed ? "审查通过" : `审查未通过：${(critique.issues || []).join("；")}`;
  host.appendChild(verdict);
}

// ── 多主题工作台（Phase 5.5）──────────────────────────────────────────
//
// 一次请求分析多个主题，每个主题一条证据链。此前只渲染第一个成功主题、
// 其余一句「见接口」带过 —— 那是把工作台的责任推回给调用方。现在每个
// 主题一条页签，点了才渲染：证据链可能很长，全铺开等于没有焦点。
// 页签区与详情区分开 —— 清详情不能清掉页签，否则点第二下就什么都没有。

const WORKBENCH = { selected: null };

function selectTopic(r) {
  WORKBENCH.selected = r;
  const detail = $("topic-detail");
  clear(detail);
  if (!r.ok) {
    // 失败主题也占一条页签：点了看到失败原因，不是消失。
    detail.appendChild(el("p", `主题「${r.topic_name}」分析失败：${r.error}`, "error"));
    return;
  }
  renderChain(detail, r.analysis.analysis.evidence);
  renderCritique(detail, r.analysis.critique);
}

function renderWorkbench(results) {
  const tabs = $("topic-tabs");
  clear(tabs);
  clear($("topic-detail"));
  WORKBENCH.selected = null;

  for (const r of results) {
    const tab = el("button", r.topic_name, r.ok ? null : "failed");
    tab.type = "button";
    tab.addEventListener("click", () => {
      for (const node of Array.from(tabs.children)) node.classList.remove("active");
      tab.classList.add("active");
      selectTopic(r);
    });
    tabs.appendChild(tab);
  }

  // 默认选中第一个成功主题；全失败时选中第一个（页签点开是错误原因）。
  const firstOk = results.find((r) => r.ok) || results[0];
  if (firstOk) {
    const firstTab = tabs.children[results.indexOf(firstOk)];
    if (firstTab) firstTab.classList.add("active");
    selectTopic(firstOk);
  }
}

// ── 时间轴 ─────────────────────────────────────────────────────────────

function renderTimeline(payload) {
  const host = $("timeline-out");
  clear(host);

  const intro = el("p", payload.note, "signal");
  host.appendChild(intro);

  // 大运分组（Phase 5.6）：十年一运，跨运的年份不该看起来连续。dayun
  // 变化时插一个分组头，把「哪几年走哪步运」摆在明面上。没有 gender
  // 时 dayun 恒 null —— 分组头照出，说明为什么不分组。
  //
  // 哨兵对象而不是 null 初值：无大运时每窗的键就是 null，用 null 做
  // 「未初始化」会让第一个分组头永远不渲染（null !== null 为假）——
  // 这个 bug 是 E2E 抓住的，契约测试只看字段路径，看不见它。
  const UNSET = {};
  let lastDayun = UNSET;
  for (const window of payload.windows) {
    const dayunKey = window.dayun ? window.dayun.sequence : null;
    if (lastDayun === UNSET || dayunKey !== lastDayun) {
      if (window.dayun) {
        const direction = window.dayun.direction === "forward" ? "顺行" : "逆行";
        host.appendChild(el("p",
          `大运 ${window.dayun.heavenly_stem}${window.dayun.earthly_branch}`
          + `（第 ${window.dayun.sequence} 步，${window.dayun.start_age_text}起，${direction}）`,
          "dayun-head"));
      } else {
        host.appendChild(el("p", "未提供性别，此时只算流年、不分大运组。", "dayun-head"));
      }
      lastDayun = dayunKey;
    }

    const block = el("div", null, "rule");
    const head = el("div", null, "rule-head");
    head.appendChild(el("span",
      `${window.liunian.stem}${window.liunian.branch}年`, "pillar-glyph"));
    head.appendChild(el("span", `证据强度 ${window.strength.toFixed(2)}`, "tag"));
    block.appendChild(head);
    block.appendChild(el("p", window.report, "report-line"));

    for (const signal of window.signals) {
      const line = el("div", null, "signal");
      line.appendChild(el("span", signal.label, null));
      line.appendChild(document.createTextNode(`　—　${signal.detail}`));
      block.appendChild(line);
    }
    if (!window.signals.length) {
      block.appendChild(el("p", "本年无显著结构信号", "empty"));
    }
    host.appendChild(block);
  }
}

// ── 典籍库（Phase 5.4）────────────────────────────────────────────────

/** 按底本聚合典籍层规则：一本书一张卡，卡内逐条列出断语与出处。
 *
 *  为什么按 book+edition 聚合而不是平铺：同一条断语的引用价值在底本 ——
 *  「哪个版本、哪一卷、逐字原文是什么」。平铺列表把这三样冲散在 81 条
 *  规则里，等于没有浏览器。 */
function groupByBook(rules) {
  const books = new Map();
  for (const rule of rules) {
    const citation = rule.citation;
    if (!citation) continue;  // 典籍层规则必有出处；没有的不该进这个视图
    const key = `${citation.book}||${citation.edition}`;
    if (!books.has(key)) {
      books.set(key, { book: citation.book, edition: citation.edition, rules: [] });
    }
    books.get(key).rules.push(rule);
  }
  return Array.from(books.values());
}

function renderLibrary(payload, backlog) {
  const host = $("library");
  clear(host);

  host.appendChild(el("p",
    `典籍层规则 ${payload.total} 条，按底本聚合。每条断语都能逐字回对固化底本，`
    + `出处带书名、底本、逐字原文与可打开地址。`, "signal"));

  const books = groupByBook(payload.rules);
  if (!books.length) {
    host.appendChild(el("p", "典籍层规则为空。", "empty"));
  }
  for (const book of books) {
    const card = el("div", null, "rule");
    const head = el("div", null, "rule-head");
    head.appendChild(el("span", `《${book.book}》`, "conclusion"));
    head.appendChild(el("span", book.edition, "tag"));
    head.appendChild(el("span", `${book.rules.length} 条`, "tag"));
    card.appendChild(head);

    for (const rule of book.rules) {
      const line = el("div", null, "cond");
      line.appendChild(el("code", rule.urn || rule.id));
      line.appendChild(document.createTextNode(`　${rule.conclusion}`));
      card.appendChild(line);
      const citation = renderCitation(rule.citation, rule.urn);
      if (citation) card.appendChild(citation);
    }
    host.appendChild(card);
  }

  // 待录入典籍：库里没有什么也要看得见。「诚实留白」是项目约束 ——
  // 只展示已录入的，会让人以为规则库已经覆盖了这些书。
  if (backlog && backlog.entries.length) {
    host.appendChild(el("p", "待录入典籍（有公有领域底本、尚未逐字录入）", "report-line"));
    for (const entry of backlog.entries) {
      const block = el("div", null, "rule");
      const head = el("div", null, "rule-head");
      head.appendChild(el("span", `《${entry.book}》`, "conclusion"));
      head.appendChild(el("span", entry.status, "tag"));
      head.appendChild(el("span", entry.topic, "tag"));
      block.appendChild(head);
      block.appendChild(el("p", `卡点：${entry.blocker}`, "signal"));
      block.appendChild(el("p", `下一步：${entry.needed_action}`, "signal"));
      host.appendChild(block);
    }
    host.appendChild(el("p", `按优先级，下一步处理：${backlog.next_action}`, "signal"));
  }
}

async function onLibrary() {
  try {
    // 两个 GET 并行：典籍规则与待录入清单互不依赖。
    const [classical, backlog] = await Promise.all([
      get("/api/rules?source_tier=classical"),
      get("/api/classics/backlog"),
    ]);
    showError("");
    renderLibrary(classical, backlog);
    $("out-library").hidden = false;
  } catch (error) {
    reportError(error);
  }
}

// ── 装配 ───────────────────────────────────────────────────────────────

async function onAnalyze(event) {
  event.preventDefault();
  const topics = selectedTopics();
  if (!topics.length) return showError("至少选一个主题。");
  const body = birthOrFieldError();
  if (!body) return;
  try {
    const payload = await post("/api/analyze/multi", { ...body, topics });
    showError("");
    clearFieldErrors();
    if (payload.results.some((r) => r.ok)) {
      renderChart(payload.chart);
      $("out-chart").hidden = false;
    }
    if (payload.results.length) {
      $("out-analysis").hidden = false;
      renderWorkbench(payload.results);
    }
  } catch (error) {
    reportError(error);
  }
}

async function onChartOnly() {
  const body = birthOrFieldError();
  if (!body) return;
  try {
    const chart = await post("/api/chart", body);
    showError("");
    clearFieldErrors();
    renderChart(chart);
    $("out-chart").hidden = false;
  } catch (error) {
    reportError(error);
  }
}

async function onTimeline() {
  const from = Number($("from").value);
  const to = Number($("to").value);
  if (!(from > 0) || !(to > 0)) return showError("时间轴起止年要是正数。");
  if (from > to) return showError("起始年不能晚于结束年。");
  const body = birthOrFieldError();
  if (!body) return;
  try {
    const payload = await post("/api/timeline",
      { ...body, topic: $("timeline-topic").value, start_year: from, end_year: to });
    showError("");
    clearFieldErrors();
    renderTimeline(payload);
    $("out-timeline").hidden = false;
  } catch (error) {
    reportError(error);
  }
}

/** 时间轴平移（Phase 5.6）：按当前跨度整段前后挪。
 *
 *  为什么按「当前跨度」而不是固定五年：用户的窗口是可调的，平移量跟着
 *  窗口走才符合「再看一段」的直觉 —— 7 年的窗口按 5 年挪会漏两年。
 *  越界保护两条就够：客户端查正整数与顺序，服务端查 50 年上限
 *  （超出是 service 层的 422，中文可读）。 */
function shiftTimeline(direction) {
  const from = Number($("from").value);
  const to = Number($("to").value);
  if (!(from > 0) || !(to > 0) || from > to) return showError("先填合法的起止年再平移。");
  const span = to - from + 1;
  const step = direction * span;
  const nextFrom = from + step;
  if (nextFrom < 1) return showError("不能再往前了。");
  $("from").value = String(nextFrom);
  $("to").value = String(to + step);
  onTimeline();
}

// ── 报告导出（Phase 5.7）─────────────────────────────────────────────

/** 触发浏览器下载。Blob + 临时锚元素，不经过任何服务端跳转。 */
function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const anchor = el("a", filename);
  anchor.href = url;
  anchor.download = filename;
  document.body.appendChild(anchor);
  anchor.click();
  document.body.removeChild(anchor);
  URL.revokeObjectURL(url);
}

/** 导出当前分析（同样的生辰与主题选择）。
 *
 *  复用 selectedTopics 与 birthOrFieldError：导出的是**刚看的这份**，
 *  不是让用户再填一遍。请求体只多一个 format —— 服务端 /api/report
 *  复用多主题分析的同一份校验（ReportRequest 继承 MultiAnalyzeRequest）。 */
async function onExport(format) {
  const topics = selectedTopics();
  if (!topics.length) return showError("至少选一个主题。");
  const body = birthOrFieldError();
  if (!body) return;
  try {
    // 走 request() 而不是裸 fetch：错误整形（fields 数组）与其余请求
    // 同一条路。区别只在拿到 Response 之后取 blob 而不是 json。
    const res = await request("POST", "/api/report", { ...body, topics, format });
    const blob = await res.blob();
    download(blob, `mingli-report.${format}`);
    showError("");
  } catch (error) {
    reportError(error);
  }
}

/** 真太阳时开关：勾选才展开经纬度行。
 *
 *  取消勾选**不清空已填的值** —— 用户可能只是想切回去看一眼民用时的结果，
 *  清空等于惩罚一次切换。请求体由 birth() 决定带不带，与输入框的显隐
 *  解耦。 */
function syncGeoRow() {
  $("geo-row").hidden = !$("tst").checked;
}

buildTopicPicker();
$("form").addEventListener("submit", onAnalyze);
$("chart-only").addEventListener("click", onChartOnly);
$("timeline").addEventListener("click", onTimeline);
$("shift-back").addEventListener("click", () => shiftTimeline(-1));
$("shift-forward").addEventListener("click", () => shiftTimeline(1));
$("export-json").addEventListener("click", () => onExport("json"));
$("export-pdf").addEventListener("click", () => onExport("pdf"));
$("library-btn").addEventListener("click", onLibrary);
$("tst").addEventListener("change", syncGeoRow);
syncGeoRow();
</script>
</body>
</html>
